name: MeritScreen
options:
  bundleIdPrefix: com.watching
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  MeritScreen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeritScreen
    resources:
      - path: MeritScreen/Resources/GoogleService-Info.plist
    info:
      path: MeritScreen/Info.plist
    dependencies:
      - target: MeritScreenDeviceActivity
      - target: MeritScreenShieldConfig
      - target: MeritScreenShieldAction
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: firebase-ios-sdk
        product: FirebaseMessaging
      - sdk: SwiftData.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_NAME: "MeritScreen"
        PRODUCT_BUNDLE_IDENTIFIER: com.watching.app
        INFOPLIST_KEY_CFBundleDisplayName: Watching
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MeritScreen/MeritScreen.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]

  MeritScreenDeviceActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeritScreenDeviceActivity
      - path: MeritScreen/Features/ScreenTime/Shared
    info:
      path: MeritScreenDeviceActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watching.app.deviceactivity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: MeritScreenDeviceActivity/MeritScreenDeviceActivity.entitlements

  MeritScreenShieldConfig:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeritScreenShieldConfig
      - path: MeritScreen/Features/ScreenTime/Shared
    info:
      path: MeritScreenShieldConfig/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: FamilyControls.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watching.app.shieldconfig
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: MeritScreenShieldConfig/MeritScreenShieldConfig.entitlements

  MeritScreenShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeritScreenShieldAction
      - path: MeritScreen/Features/ScreenTime/Shared
    info:
      path: MeritScreenShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watching.app.shieldaction
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: MeritScreenShieldAction/MeritScreenShieldAction.entitlements

  MeritScreenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeritScreenTests
    dependencies:
      - target: MeritScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watching.app.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST: YES
