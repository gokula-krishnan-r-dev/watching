name: Desktop CI

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    name: cargo + ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf x11-utils xdotool

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/apps/meritscreen-ui/ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install UI deps
        working-directory: desktop/apps/meritscreen-ui/ui
        run: npm ci

      - name: UI typecheck + build
        working-directory: desktop/apps/meritscreen-ui/ui
        run: npm run build

      - name: a11y smoke (launcher + quiz + fail lock)
        working-directory: desktop/apps/meritscreen-ui/ui
        run: npm run a11y-smoke

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Conformance + resilience (d12)
        run: |
          cargo test -p meritscreen-core vectors
          cargo test -p meritscreen-guardian --test resilience
          cargo test -p meritscreen-updater

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Windows Guardian / Agent smoke
        if: runner.os == 'Windows'
        run: |
          cargo build -p meritscreen-guardian -p meritscreen-agent
          .\target\debug\meritscreen-guardian.exe --help
          .\target\debug\meritscreen-agent.exe --help
          $env:MERITSCREEN_DATA_DIR = Join-Path $env:RUNNER_TEMP "ms-data"
          $env:MERITSCREEN_SECRETS_DIR = Join-Path $env:RUNNER_TEMP "ms-secrets"
          New-Item -ItemType Directory -Force -Path $env:MERITSCREEN_DATA_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:MERITSCREEN_SECRETS_DIR | Out-Null
          $guardian = Start-Process -PassThru -NoNewWindow -FilePath .\target\debug\meritscreen-guardian.exe -ArgumentList "--no-agent"
          Start-Sleep -Seconds 3
          if ($guardian.HasExited) { throw "guardian exited early code=$($guardian.ExitCode)" }
          Stop-Process -Id $guardian.Id -Force
          .\target\debug\meritscreen-guardian.exe --perf-smoke
          pwsh .\packaging\windows\build-msi.ps1 -Configuration debug
          Write-Host "Windows guardian console + perf smoke + MSI staging OK"

      - name: macOS Guardian / Agent smoke
        if: runner.os == 'macOS'
        run: |
          cargo build -p meritscreen-guardian -p meritscreen-agent
          ./target/debug/meritscreen-guardian --help
          ./target/debug/meritscreen-agent --help
          export MERITSCREEN_DATA_DIR="$RUNNER_TEMP/ms-data"
          export MERITSCREEN_SECRETS_DIR="$RUNNER_TEMP/ms-secrets"
          mkdir -p "$MERITSCREEN_DATA_DIR" "$MERITSCREEN_SECRETS_DIR"
          ./target/debug/meritscreen-guardian --no-agent &
          GPID=$!
          sleep 3
          if ! kill -0 "$GPID" 2>/dev/null; then echo "guardian exited early"; exit 1; fi
          kill "$GPID" 2>/dev/null || true
          wait "$GPID" 2>/dev/null || true
          ./target/debug/meritscreen-guardian --perf-smoke
          # Plist templates present for pkg / SMAppService layout
          test -f packaging/macos/com.meritscreen.guardian.plist
          test -f packaging/macos/com.meritscreen.agent.plist
          test -f packaging/macos/entitlements.plist
          BUILD_CONFIG=debug ./packaging/macos/build-pkg.sh
          test -f target/macos-pkg/MeritScreen-0.1.0.pkg
          echo "macOS guardian console + perf smoke + pkg build OK"

      - name: Linux Guardian / Agent smoke
        if: runner.os == 'Linux'
        run: |
          cargo build -p meritscreen-guardian -p meritscreen-agent
          ./target/debug/meritscreen-guardian --help
          ./target/debug/meritscreen-agent --help
          export MERITSCREEN_DATA_DIR="$RUNNER_TEMP/ms-data"
          export MERITSCREEN_SECRETS_DIR="$RUNNER_TEMP/ms-secrets"
          mkdir -p "$MERITSCREEN_DATA_DIR" "$MERITSCREEN_SECRETS_DIR"
          ./target/debug/meritscreen-guardian --no-agent &
          GPID=$!
          sleep 3
          if ! kill -0 "$GPID" 2>/dev/null; then echo "guardian exited early"; exit 1; fi
          kill "$GPID" 2>/dev/null || true
          wait "$GPID" 2>/dev/null || true
          ./target/debug/meritscreen-guardian --perf-smoke
          test -f packaging/linux/meritscreen-guardian.service
          test -f packaging/linux/meritscreen-agent.desktop
          BUILD_CONFIG=debug ./packaging/linux/build-deb.sh
          test -f target/linux-deb/meritscreen_0.1.0_amd64.deb
          echo "Linux guardian console + perf smoke + deb build OK"
