[package]
name = "meritscreen-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri 2 UI host — parent + child graphs (role gate in d1)"
rust-version.workspace = true

[lib]
name = "meritscreen_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meritscreen-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
meritscreen-child = { workspace = true }
meritscreen-core = { workspace = true }
meritscreen-ipc = { workspace = true }
meritscreen-parent = { workspace = true }
meritscreen-security = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tracing = { workspace = true }

[features]
# Production / `cargo run`: load bundled `ui/dist` via asset protocol.
# `cargo tauri dev` disables this so the Vite `devUrl` is used instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = { workspace = true }
