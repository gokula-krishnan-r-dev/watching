[package]
name = "meritscreen-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Per-user Session Agent (foreground tracking, overlay spawn)"
rust-version.workspace = true

[[bin]]
name = "meritscreen-agent"
path = "src/main.rs"

[dependencies]
meritscreen-core = { workspace = true }
meritscreen-enforcement = { workspace = true }
meritscreen-ipc = { workspace = true }
meritscreen-security = { workspace = true }
anyhow = { workspace = true }
ctrlc = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSColor",
    "NSScreen",
    "NSResponder",
    "NSEvent",
    "NSGraphics",
] }
