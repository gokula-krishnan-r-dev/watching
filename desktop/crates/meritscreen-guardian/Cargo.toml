[package]
name = "meritscreen-guardian"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Always-on Guardian service binary (boot → enforce → sync)"
rust-version.workspace = true

[lib]
name = "meritscreen_guardian"
path = "src/lib.rs"

[[bin]]
name = "meritscreen-guardian"
path = "src/main.rs"

[dependencies]
meritscreen-core = { workspace = true }
meritscreen-db = { workspace = true }
meritscreen-enforcement = { workspace = true }
meritscreen-firebase = { workspace = true }
meritscreen-ipc = { workspace = true }
meritscreen-security = { workspace = true }
meritscreen-updater = { workspace = true }
anyhow = { workspace = true }
ctrlc = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
meritscreen-ipc = { workspace = true }
