[workspace]
resolver = "2"
members = [
    "crates/meritscreen-core",
    "crates/meritscreen-db",
    "crates/meritscreen-firebase",
    "crates/meritscreen-security",
    "crates/meritscreen-ipc",
    "crates/meritscreen-updater",
    "crates/meritscreen-parent",
    "crates/meritscreen-child",
    "crates/meritscreen-enforcement",
    "crates/meritscreen-guardian",
    "crates/meritscreen-agent",
    "apps/meritscreen-ui",
]
default-members = [
    "crates/meritscreen-core",
    "crates/meritscreen-db",
    "crates/meritscreen-firebase",
    "crates/meritscreen-security",
    "crates/meritscreen-ipc",
    "crates/meritscreen-updater",
    "crates/meritscreen-parent",
    "crates/meritscreen-child",
    "crates/meritscreen-enforcement",
    "crates/meritscreen-guardian",
    "crates/meritscreen-agent",
    "apps/meritscreen-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["MeritScreen"]
repository = "https://github.com/meritscreen/MeritScreen"
rust-version = "1.80"

[workspace.dependencies]
meritscreen-core = { path = "crates/meritscreen-core" }
meritscreen-db = { path = "crates/meritscreen-db" }
meritscreen-firebase = { path = "crates/meritscreen-firebase" }
meritscreen-security = { path = "crates/meritscreen-security" }
meritscreen-ipc = { path = "crates/meritscreen-ipc" }
meritscreen-updater = { path = "crates/meritscreen-updater" }
meritscreen-parent = { path = "crates/meritscreen-parent" }
meritscreen-child = { path = "crates/meritscreen-child" }
meritscreen-enforcement = { path = "crates/meritscreen-enforcement" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
interprocess = "2"
ctrlc = "3"
parking_lot = "0.12"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
